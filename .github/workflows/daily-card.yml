name: Redraw the share card

# Every night just after midnight in Washington, redraw og-card.jpg so the link
# preview carries that day's colours, moon, zodiac season and holiday seal.
on:
  schedule:
    - cron: "11 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the renderer
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Draw today's card
        env:
          TZ: America/Los_Angeles
        run: node tools/og-daily.js
      - name: Save it
        run: |
          if git diff --quiet og-card.jpg; then echo "No change today."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-card.jpg
          git commit -m "Today's share card"
          git push
